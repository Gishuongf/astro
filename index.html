<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Пингвин</title>
    <!-- Библиотека Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #111;
            font-family: sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
        #ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #00e5ff;
            color: #000;
            font-weight: bold;
            font-size: 18px;
            border-radius: 50px;
            border: none;
            padding: 16px 36px;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
            cursor: pointer;
            z-index: 10;
        }
        #ar-button:active {
            transform: translateX(-50%) scale(0.95);
        }
    </style>
</head>
<body>

    <model-viewer 
        src="penguin.glb" 
        ios-src="penguin.usdz"
        alt="Анимированный пингвин"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="auto"
        camera-controls 
        autoplay 
        shadow-intensity="1"
        environment-image="neutral"
    >
        <button slot="ar-button" id="ar-button">
            🐧 Поставить на пол
        </button>
    </model-viewer>

</body>
</html>
